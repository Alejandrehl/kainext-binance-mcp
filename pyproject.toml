[project]
name = "kainext-binance-mcp"
version = "1.2.1"
description = "MCP server for Binance: read market data, analyze, and propose real-money spot trades behind a human-gated confirmer — plus an offline USD-M futures research engine. The model never holds a trade key."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alejandro Exequiel Hernández Lara" }]
keywords = ["mcp", "binance", "trading", "crypto", "spot", "futures", "backtesting", "quant", "model-context-protocol", "llm", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]==2.0.0",
    "python-binance==1.0.37",
    "pydantic==2.13.4",
    "pandas==3.0.5",
    "feedparser==6.0.14",
    "requests==2.34.2",
]

[project.optional-dependencies]
# Research/backtesting: NO lo necesita el servidor MCP. Quien instala por `uvx` no
# arrastra nada de esto.
research = ["numpy==2.5.2"]
# `research` NO lo instala quien usa el servidor MCP. El CI sí lo instala, o `futures/`
# no importaría y la cobertura de esos archivos caería a 0 (build rojo por la razón
# equivocada).
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "mypy==2.3.1", "ruff==0.16.3", "pytest-asyncio==1.4.0"]

[project.urls]
Homepage = "https://github.com/Alejandrehl/kainext-binance-mcp"
Repository = "https://github.com/Alejandrehl/kainext-binance-mcp"
Issues = "https://github.com/Alejandrehl/kainext-binance-mcp/issues"
Security = "https://github.com/Alejandrehl/kainext-binance-mcp/blob/main/SECURITY.md"

[project.scripts]
kainext-binance-mcp = "kainext_binance_mcp.server:main"
kainext-binance-mcp-confirmer = "kainext_binance_mcp_confirmer.__main__:main"
kainext-binance-mcp-watch = "kainext_binance_mcp.watch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Layout src/ con dos paquetes: hatchling debe saber dónde viven.
packages = ["src/kainext_binance_mcp", "src/kainext_binance_mcp_confirmer"]

[tool.pytest.ini_options]
# --cov-fail-under=90: gate duro de merge (plan §5). Los módulos críticos del gate
# (intents/ipc/idempotency/guard/executor) están al 100%/≥95% por sus tests dedicados.
addopts = "--cov=kainext_binance_mcp --cov=kainext_binance_mcp_confirmer --cov-report=term-missing --cov-fail-under=90"
markers = ["integration: tests que pegan a testnet (requieren keys)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Gate de warnings: `error` por defecto ⇒ un warning nuevo rompe el build. Los ignores
# son SOLO de dependencias upstream, cada uno con su causa nombrada; si alguna sube de
# versión y deja de emitirlos, este bloque se poda.
filterwarnings = [
    "error",
    # python-binance 1.0.37 importa el módulo legacy de `websockets` al cargar su cliente.
    "ignore:websockets.WebSocketClientProtocol is deprecated:DeprecationWarning",
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    # python-binance usa asyncio.get_event_loop() fuera de corrutina en sus helpers.
    "ignore:There is no current event loop:DeprecationWarning",
    # mcp[cli] declara `lifespan` con una forward reference sin resolver.
    "ignore:Field 'lifespan' has an incomplete definition:UserWarning",
    # Los tests de IPC arrancan `serve()` en un hilo daemon que por diseño no se apaga
    # (el confirmador es un proceso de vida larga que se mata). Su listener queda abierto
    # y el GC lo recolecta en cualquier test posterior, así que el ignore no puede ir
    # acotado por archivo. Va por MENSAJE, no por categoría: cualquier otro
    # ResourceWarning sigue rompiendo el build. Producción sí cierra: `serve()` en su
    # finally (ipc.py:217) y `IpcClient._request` en el suyo (ipc.py:92).
    "ignore:unclosed <socket.socket:ResourceWarning",
    # python-binance (`helpers.py:90 get_loop`) llama a `asyncio.get_event_loop()`, que en
    # Python 3.12 CREA un loop y no lo cierra nunca; en 3.13 ese método ya no crea nada, y
    # por eso solo fallaban las celdas 3.12 de la matriz. El loop huérfano avisa cuando el
    # GC pasa, así que el fallo es NO DETERMINISTA: local puede salir verde por suerte.
    # No es nuestro loop y cerrarlo por fuera rompería a quien lo reutilice.
    "ignore:unclosed event loop:ResourceWarning",
]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["kainext_binance_mcp", "kainext_binance_mcp_confirmer"]

# Librerías sin stubs de tipos (binance, mcp): no romper strict por imports no tipados.
[[tool.mypy.overrides]]
module = ["binance.*", "mcp.*", "pandas.*"]
ignore_missing_imports = true

# feedparser (capa 3): pure-python sin stubs de tipos.
[[tool.mypy.overrides]]
module = ["feedparser.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E501 activo (antes el default no lo incluía y el line-length era decorativo);
# BLE001 activo (los `noqa: BLE001` del código eran decorativos sin esta regla).
select = ["E", "F", "I", "B", "UP", "SIM", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Tests: estilo compacto deliberado (`a = X(); b = Y()`) y literales de datos largos.
"tests/*" = ["E702", "E501"]
# Examples: scripts de research congelados (reproducen resultados publicados en
# docs/research/); el churn de formato no aporta y rompería el diff con la corrida original.
"examples/*" = ["E501", "SIM102", "SIM115"]
