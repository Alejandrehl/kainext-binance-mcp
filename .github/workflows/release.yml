name: Release (PyPI)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Un tag publica a PyPI lo que haya en ese commit. Sin este job, un tag sobre un commit
  # con el CI en rojo (o sin CI) llegaba igual a quien instala por `uvx`.
  verify:
    name: gates + tag == version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Tag matches pyproject version
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} != v${version} (pyproject)"; exit 1; }
      - name: Install project (dev + research)
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,research]"
      - run: uv run ruff check src/ tests/ examples/
      - run: uv run mypy
      - run: uv run pytest -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC) — sin tokens versionados
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
