name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint + types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv (Python 3.12) + install project (dev)
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Ruff (lint del código fuente — gate de release)
        run: uv run ruff check src/

      - name: Mypy (strict sobre los paquetes fuente)
        run: uv run mypy

      - name: Pytest (unit; la integración se skipea sin secrets)
        # --cov-fail-under=90 vive en pyproject (addopts): gate duro de merge.
        run: uv run pytest -q
