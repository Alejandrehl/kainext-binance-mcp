name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint + types + tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS en la matriz: el confirmador es macOS-only (osascript) — su OS objetivo
        # debe correr los tests, no solo ubuntu.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv + install project (dev)
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"

      - name: Ruff (src + tests + examples — gate de release)
        run: uv run ruff check src/ tests/ examples/

      - name: Mypy (strict sobre los paquetes fuente)
        run: uv run mypy

      - name: Pytest (unit; integración se skipea sin secrets/red)
        # --cov-fail-under=90 vive en pyproject (addopts): gate duro de merge.
        run: uv run pytest -q

  audit:
    name: pip-audit (CVEs de los pins exactos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install project + pip-audit
        run: |
          uv venv --python 3.12
          uv pip install -e . pip-audit
      - name: pip-audit
        run: uv run pip-audit --skip-editable
